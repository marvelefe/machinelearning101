name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # NOTE: The Cloudflare Worker in worker/ is a separate sub-project with its own
  # dependencies, tsconfig and tests. It is intentionally NOT part of this
  # workflow yet because its test suite currently has pre-existing failures and
  # type errors (see the tracking issue). Once those are resolved, add a job here:
  #
  #   worker:
  #     runs-on: ubuntu-latest
  #     defaults:
  #       run:
  #         working-directory: worker
  #     steps:
  #       - uses: actions/checkout@v7
  #       - uses: actions/setup-node@v7
  #         with:
  #           node-version-file: .nvmrc
  #           cache: npm
  #           cache-dependency-path: worker/package-lock.json
  #       - run: npm ci
  #       - run: npm run type-check
  #       - run: npm run test
